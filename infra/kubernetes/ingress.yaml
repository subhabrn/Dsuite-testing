apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: resource-allocation-ingress
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  rules:
  - host: resource-allocation.example.com
    http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: resource-allocation-backend-service
            port:
              number: 8000
      - path: /
        pathType: Prefix
        backend:
          service:
            name: resource-allocation-frontend-service
            port:
              number: 80
