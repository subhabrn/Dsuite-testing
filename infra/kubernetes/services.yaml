apiVersion: v1
kind: Service
metadata:
  name: backend-service
spec:
  selector:
    app: resource-allocation-backend
  ports:
  - port: 80
    targetPort: 8000
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
spec:
  selector:
    app: resource-allocation-frontend
  ports:
  - port: 80
    targetPort: 80
  type: ClusterIP
